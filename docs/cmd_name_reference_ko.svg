<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" font-family="Malgun Gothic, Segoe UI, sans-serif" role="img" aria-label="CMD Name 테스트 스텝 명령어 참조">
  <rect x="0" y="0" width="720" height="620" rx="16" fill="#1F2A35"/>

  <text x="28" y="42" fill="#FFFFFF" font-size="22" font-weight="600">CMD Name — 테스트 스텝 명령어</text>
  <rect x="28" y="54" width="664" height="1" fill="#3A4A57"/>

  <!-- NOP -->
  <g transform="translate(28,74)">
    <rect x="0" y="0" width="664" height="92" rx="12" fill="#2A3744"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#8A97A3"/>
    <text x="26" y="38" fill="#8A97A3" font-size="20" font-weight="700" font-family="Consolas, monospace">NOP</text>
    <text x="98" y="38" fill="#FFFFFF" font-size="16">동작 없음</text>
    <text x="26" y="68" fill="#B9C4CE" font-size="14.5">아무 동작도 하지 않음. 시간 지연 용도로만 사용 (Time Delay &#8800; 0).</text>
  </g>

  <!-- CALIB -->
  <g transform="translate(28,180)">
    <rect x="0" y="0" width="664" height="92" rx="12" fill="#2A3744"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#4A9FE0"/>
    <text x="26" y="38" fill="#4A9FE0" font-size="20" font-weight="700" font-family="Consolas, monospace">CALIB</text>
    <text x="118" y="38" fill="#FFFFFF" font-size="16">캘리브레이션</text>
    <rect x="520" y="22" width="130" height="22" rx="11" fill="#1B3A52"/>
    <text x="585" y="37" fill="#7FC0F0" font-size="12" text-anchor="middle">시퀀스 시작</text>
    <text x="26" y="68" fill="#B9C4CE" font-size="14.5">센서 보정 루틴을 실행. 보통 테스트 시퀀스 맨 앞에 배치.</text>
  </g>

  <!-- LOAD -->
  <g transform="translate(28,286)">
    <rect x="0" y="0" width="664" height="92" rx="12" fill="#2A3744"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#4A9FE0"/>
    <text x="26" y="38" fill="#4A9FE0" font-size="20" font-weight="700" font-family="Consolas, monospace">LOAD</text>
    <text x="110" y="38" fill="#FFFFFF" font-size="16">사전 보정값 로드</text>
    <rect x="520" y="22" width="130" height="22" rx="11" fill="#1B3A52"/>
    <text x="585" y="37" fill="#7FC0F0" font-size="12" text-anchor="middle">시퀀스 시작</text>
    <text x="26" y="68" fill="#B9C4CE" font-size="14.5">미리 정의된 사전 보정값을 MICOM에 로드. 보통 시퀀스 맨 앞에 배치.</text>
  </g>

  <!-- KEY -->
  <g transform="translate(28,392)">
    <rect x="0" y="0" width="664" height="92" rx="12" fill="#2A3744"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#E0A100"/>
    <text x="26" y="38" fill="#E0A100" font-size="20" font-weight="700" font-family="Consolas, monospace">KEY</text>
    <text x="96" y="38" fill="#FFFFFF" font-size="16">키 입력</text>
    <text x="26" y="68" fill="#B9C4CE" font-size="14.5">펜 · 솔레노이드가 패널을 눌러 터치 동작을 수행.</text>
  </g>

  <!-- MEAS -->
  <g transform="translate(28,498)">
    <rect x="0" y="0" width="664" height="92" rx="12" fill="#2A3744"/>
    <rect x="0" y="0" width="6" height="92" rx="3" fill="#5BC271"/>
    <text x="26" y="38" fill="#5BC271" font-size="20" font-weight="700" font-family="Consolas, monospace">MEAS</text>
    <text x="112" y="38" fill="#FFFFFF" font-size="16">측정</text>
    <text x="26" y="68" fill="#B9C4CE" font-size="14.5">터치 위치의 센싱 값을 읽고 검증.</text>
  </g>
</svg>
